<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Slideshow</title>
<style>
  :root {
    --bg: #0c0c0d;
    --panel: #17171a;
    --panel2: #1e1e22;
    --line: #2a2a2e;
    --text: #ece9e2;
    --muted: #8c8a86;
    --accent: #e0a458;
    --danger: #c96a4f;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    height: 100%;
    overflow: hidden;
  }
  button { font-family: inherit; }

  .view { display: none; height: 100%; }
  .view.active { display: block; }

  .scroll { height: 100%; overflow-y: auto; padding: 40px 24px 60px; }
  .wrap { max-width: 760px; margin: 0 auto; }

  .topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 28px; }
  .topbar h1 { font-size: 21px; font-weight: 500; margin: 0; letter-spacing: 0.2px; }
  .topbar .sub { color: var(--muted); font-size: 13px; margin-top: 4px; }

  .btn {
    background: var(--panel2);
    border: 1px solid var(--line);
    color: var(--text);
    border-radius: 3px;
    padding: 9px 16px;
    font-size: 13px;
    cursor: pointer;
  }
  .btn:hover { border-color: #444; }
  .btn.primary { background: var(--accent); color: #201400; border-color: var(--accent); font-weight: 600; }
  .btn.primary:hover { filter: brightness(1.08); }
  .btn.primary:disabled { background: var(--line); color: var(--muted); border-color: var(--line); cursor: not-allowed; filter: none; }
  .btn.ghost { background: transparent; border-color: transparent; color: var(--muted); }
  .btn.ghost:hover { color: var(--text); }

  .album-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; }
  .album-card { background: var(--panel); border: 1px solid var(--line); border-radius: 4px; overflow: hidden; cursor: pointer; text-align: left; position: relative; }
  .album-card:hover { border-color: #444; }
  .album-cover { width: 100%; aspect-ratio: 4/3; background: #000; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .album-cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .album-cover .empty-cover { color: var(--muted); font-size: 12px; }
  .album-meta { padding: 10px 12px 12px; }
  .album-name { font-size: 14px; margin: 0 0 3px; }
  .album-count { font-size: 12px; color: var(--muted); margin: 0; }
  .album-del {
    position: absolute; top: 6px; right: 6px; width: 22px; height: 22px;
    border-radius: 3px; background: rgba(0,0,0,0.6); color: #fff; border: none;
    font-size: 13px; cursor: pointer; line-height: 22px; padding: 0;
    opacity: 0; transition: opacity 0.15s ease;
  }
  .album-card:hover .album-del { opacity: 1; }

  .empty-state { text-align: center; padding: 60px 20px; color: var(--muted); font-size: 14px; }

  .back-row { margin-bottom: 18px; }
  .album-title-row { display: flex; align-items: baseline; gap: 10px; margin-bottom: 4px; }
  .album-title-row h1 { cursor: text; }
  .edit-name-hint { font-size: 12px; color: var(--muted); }

  .drop {
    border: 1px dashed var(--line); border-radius: 4px; padding: 22px 16px;
    text-align: center; cursor: pointer; transition: border-color 0.15s ease, background 0.15s ease;
    margin: 22px 0 20px;
  }
  .drop:hover, .drop.dragover { border-color: var(--accent); background: rgba(224, 164, 88, 0.05); }
  .drop input { display: none; }
  .drop-label { font-size: 14px; }
  .drop-sub { font-size: 12px; color: var(--muted); margin-top: 4px; }

  .thumb-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 8px; margin-bottom: 30px; }
  .thumb { position: relative; aspect-ratio: 1; border-radius: 3px; overflow: hidden; background: #000; border: 1px solid var(--line); }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .thumb button {
    position: absolute; top: 0; right: 0; width: 20px; height: 20px;
    background: rgba(0,0,0,0.7); color: #fff; border: none; font-size: 12px;
    line-height: 20px; cursor: pointer; padding: 0;
  }

  .settings-card { background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 20px 22px; }
  .field-row { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; }
  .field-row label { font-size: 13px; color: var(--muted); }
  .duration-input { display: flex; align-items: center; gap: 8px; }
  .duration-input input[type="number"] {
    width: 64px; background: var(--bg); border: 1px solid var(--line); color: var(--text);
    border-radius: 3px; padding: 6px 8px; font-size: 14px;
  }
  .duration-input span { font-size: 13px; color: var(--muted); }
  .checkbox-field { display: flex; align-items: center; gap: 8px; }
  .checkbox-field input { accent-color: var(--accent); }

  .start-row { margin-top: 22px; }
  .start-row .btn { width: 100%; padding: 13px; font-size: 14px; }
  .start-row .btn + .btn { margin-top: 10px; }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }

  #show { position: fixed; inset: 0; background: #000; z-index: 100; display: none; }
  .slide-img {
    position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain;
    background: #000; opacity: 0; transition: opacity 0.5s ease;
  }
  .slide-img.visible { opacity: 1; }

  #hud {
    position: fixed; top: 0; left: 0; right: 0; display: flex; align-items: center;
    justify-content: space-between; padding: 16px 20px;
    background: linear-gradient(to bottom, rgba(0,0,0,0.55), transparent);
    opacity: 0; transition: opacity 0.25s ease; pointer-events: none; z-index: 5;
  }
  #show:hover #hud { opacity: 1; pointer-events: auto; }
  #hud .count { font-size: 13px; color: rgba(255,255,255,0.75); letter-spacing: 0.3px; }
  #hud .controls { display: flex; gap: 10px; }
  #hud button {
    background: rgba(20,20,20,0.6); border: 1px solid rgba(255,255,255,0.15); color: #fff;
    border-radius: 3px; padding: 7px 12px; font-size: 13px; cursor: pointer;
  }
  #hud button:hover { background: rgba(40,40,40,0.8); }

  #progressTrack { position: fixed; bottom: 0; left: 0; right: 0; height: 2px; background: rgba(255,255,255,0.12); z-index: 5; }
  #progressBar { height: 100%; width: 0%; background: var(--accent); }

  .hint {
    position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%);
    font-size: 11px; color: rgba(255,255,255,0.4); z-index: 5; text-align: center; pointer-events: none;
  }

  .toast {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: var(--panel2); border: 1px solid var(--line); color: var(--text);
    padding: 10px 16px; border-radius: 4px; font-size: 13px;
    opacity: 0; pointer-events: none; transition: opacity 0.2s ease; z-index: 200;
  }
  .toast.show { opacity: 1; }

  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 300;
    padding: 20px;
  }
  .modal-overlay.show { display: flex; }
  .modal-box {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 5px;
    padding: 24px;
    width: 100%;
    max-width: 360px;
  }
  .modal-title { font-size: 16px; font-weight: 500; margin: 0 0 8px; }
  .modal-message { font-size: 13px; color: var(--muted); margin: 0 0 14px; line-height: 1.5; }
  .modal-input {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--line);
    color: var(--text);
    border-radius: 3px;
    padding: 9px 10px;
    font-size: 14px;
    margin-bottom: 18px;
  }
  .modal-input:focus { outline: none; border-color: var(--accent); }
  .modal-actions { display: flex; justify-content: flex-end; gap: 10px; }
  .btn.danger { background: var(--danger); color: #2a0d05; border-color: var(--danger); font-weight: 600; }
  .btn.danger:hover { filter: brightness(1.08); }

  .thumb img { cursor: zoom-in; }

  .lightbox {
    position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 250;
    display: none; align-items: center; justify-content: center; padding: 30px;
    cursor: zoom-out;
  }
  .lightbox.show { display: flex; }
  .lightbox img {
    max-width: 100%; max-height: 100%; object-fit: contain;
    box-shadow: 0 10px 40px rgba(0,0,0,0.5);
  }
  .lightbox-close {
    position: fixed; top: 16px; right: 20px; width: 34px; height: 34px;
    border-radius: 3px; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15);
    color: #fff; font-size: 18px; cursor: pointer; line-height: 32px; padding: 0;
  }
  .lightbox-close:hover { background: rgba(255,255,255,0.18); }
</style>
</head>
<body>

<div class="view active" id="view-albums">
  <div class="scroll"><div class="wrap">
    <div class="topbar">
      <div>
        <h1>Albums</h1>
        <div class="sub" id="albumsSub">Loading…</div>
        <div class="sub" id="cloudStatus" style="margin-top:2px;">Cloud: not connected</div>
      </div>
      <button class="btn primary" id="newAlbumBtn">New album</button>
    </div>
    <div class="album-grid" id="albumGrid"></div>
    <div class="empty-state" id="emptyState" style="display:none;">No albums yet. Create one to start adding images.</div>
  </div></div>
</div>

<div class="view" id="view-album">
  <div class="scroll"><div class="wrap">
    <div class="back-row"><button class="btn ghost" id="backBtn">← All albums</button></div>
    <div class="album-title-row"><h1 id="albumTitle" title="Click to rename"></h1></div>
    <div class="edit-name-hint">Click the name to rename this album</div>

    <div class="drop" id="dropZone">
      <input type="file" id="fileInput" accept="image/*" multiple>
      <div class="drop-label">Click to add images, or drag them here</div>
      <div class="drop-sub">They'll be saved in this album on this device</div>
    </div>

    <div class="thumb-grid" id="thumbGrid"></div>

    <div class="settings-card">
      <div class="field-row">
        <label>Show each image for</label>
        <div class="duration-input">
          <input type="number" id="duration" min="0.5" step="0.5" value="4">
          <span>seconds</span>
        </div>
      </div>
      <div class="field-row">
        <label for="loop">Loop back to the start when finished</label>
        <div class="checkbox-field"><input type="checkbox" id="loop" checked></div>
      </div>
      <div class="field-row">
        <label for="shuffle">Shuffle order</label>
        <div class="checkbox-field"><input type="checkbox" id="shuffle"></div>
      </div>
    </div>

    <div class="start-row">
      <button class="btn primary" id="startBtn" disabled>Add images to start</button>
      <button class="btn" id="exportBtn" disabled>Export images (.zip)</button>
    </div>
  </div></div>
</div>

<div id="show">
  <div id="hud">
    <div class="count" id="hudCount">1 / 1</div>
    <div class="controls">
      <button id="prevBtn">Prev</button>
      <button id="pauseBtn">Pause</button>
      <button id="nextBtn">Next</button>
      <button id="exitBtn">Exit</button>
    </div>
  </div>
  <div id="slideLayer"></div>
  <div id="progressTrack"><div id="progressBar"></div></div>
  <div class="hint">Space to pause · Arrow keys to navigate · Esc to exit</div>
</div>

<div class="toast" id="toast"></div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal-box">
    <h2 class="modal-title" id="modalTitle">Title</h2>
    <p class="modal-message" id="modalMessage"></p>
    <input type="text" class="modal-input" id="modalInput">
    <div class="modal-actions">
      <button class="btn ghost" id="modalCancel">Cancel</button>
      <button class="btn primary" id="modalConfirm">OK</button>
    </div>
  </div>
</div>

<div class="lightbox" id="lightbox">
  <button class="lightbox-close" id="lightboxClose" title="Close">×</button>
  <img id="lightboxImg" src="" alt="">
</div>

<script>
(function() {
  const DB_NAME = 'slideshow-albums-db';
  const DB_VERSION = 1;
  const STORE = 'albums';
  let dbPromise = null;

  function openDB() {
    if (dbPromise) return dbPromise;
    dbPromise = new Promise((resolve, reject) => {
      const req = indexedDB.open(DB_NAME, DB_VERSION);
      req.onupgradeneeded = () => {
        const db = req.result;
        if (!db.objectStoreNames.contains(STORE)) db.createObjectStore(STORE, { keyPath: 'id' });
      };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
    return dbPromise;
  }

  async function dbGetAll() {
    const db = await openDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(STORE, 'readonly');
      const req = tx.objectStore(STORE).getAll();
      req.onsuccess = () => resolve(req.result || []);
      req.onerror = () => reject(req.error);
    });
  }

  async function dbPut(album) {
    const db = await openDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(STORE, 'readwrite');
      tx.objectStore(STORE).put(album);
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    });
  }

  async function dbDelete(id) {
    const db = await openDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(STORE, 'readwrite');
      tx.objectStore(STORE).delete(id);
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    });
  }

  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 9); }

  // ---------------- Cloud sync (private, via Cloudflare Worker + Drime) ----------------
  const CLOUD_WORKER_URL = 'https://slideshow.scotmorgan621.workers.dev';
  let cloudPassword = localStorage.getItem('cloudAppPassword') || '';
  const cloudStatusEl = document.getElementById('cloudStatus');

  function setCloudStatus(text) {
    if (cloudStatusEl) cloudStatusEl.textContent = 'Cloud: ' + text;
  }

  async function ensureCloudPassword(forceAsk) {
    if (cloudPassword && !forceAsk) return cloudPassword;
    const pw = await openModal({
      title: 'Cloud sync password',
      message: 'Enter the password you set for your private cloud storage. It stays only in this browser.',
      withInput: true,
      confirmLabel: 'Save'
    });
    if (pw) {
      cloudPassword = pw;
      localStorage.setItem('cloudAppPassword', pw);
    }
    return cloudPassword;
  }

  async function cloudFetch(path, options) {
    options = options || {};
    const pw = await ensureCloudPassword();
    if (!pw) throw new Error('no-password');
    const headers = Object.assign({}, options.headers, { 'X-App-Password': pw });
    const resp = await fetch(CLOUD_WORKER_URL + path, Object.assign({}, options, { headers }));
    if (resp.status === 401) {
      localStorage.removeItem('cloudAppPassword');
      cloudPassword = '';
      throw new Error('bad-password');
    }
    return resp;
  }

  cloudStatusEl && cloudStatusEl.addEventListener('click', () => ensureCloudPassword(true).then(() => syncWithCloud()));
  if (cloudStatusEl) { cloudStatusEl.style.cursor = 'pointer'; cloudStatusEl.title = 'Click to change your cloud password or re-sync'; }

  async function buildAlbumZipBlob(album) {
    const meta = {
      id: album.id,
      name: album.name,
      duration: album.duration,
      loop: album.loop,
      shuffle: album.shuffle,
      updatedAt: album.updatedAt
    };
    const metaBlob = new Blob([JSON.stringify(meta)], { type: 'application/json' });
    const images = album.images || [];
    const names = uniqueNames(images);
    const entries = [{ name: '__meta.json', blob: metaBlob }];
    images.forEach((img, i) => {
      const prefix = String(i).padStart(5, '0');
      entries.push({ name: prefix + '__' + names[i], blob: img.blob });
    });
    return buildZip(entries);
  }

  function parseZip(buf) {
    const view = new DataView(buf);
    const bytes = new Uint8Array(buf);
    const entries = [];
    let offset = 0;
    while (offset + 4 <= buf.byteLength) {
      if (view.getUint32(offset, true) !== 0x04034b50) break;
      const compSize = view.getUint32(offset + 18, true);
      const nameLen = view.getUint16(offset + 26, true);
      const extraLen = view.getUint16(offset + 28, true);
      const nameStart = offset + 30;
      const name = new TextDecoder('utf-8').decode(bytes.slice(nameStart, nameStart + nameLen));
      const dataStart = nameStart + nameLen + extraLen;
      const data = bytes.slice(dataStart, dataStart + compSize);
      entries.push({ name, data });
      offset = dataStart + compSize;
    }
    return entries;
  }

  function guessMimeFromName(name) {
    const m = name.match(/\.([A-Za-z0-9]+)$/);
    const ext = m ? m[1].toLowerCase() : '';
    const map = { jpg: 'image/jpeg', jpeg: 'image/jpeg', png: 'image/png', gif: 'image/gif', webp: 'image/webp',
      avif: 'image/avif', bmp: 'image/bmp', svg: 'image/svg+xml', heic: 'image/heic', heif: 'image/heif', tif: 'image/tiff' };
    return map[ext] || 'application/octet-stream';
  }

  let cloudSyncing = false;

  async function backupAlbumToCloud(album) {
    try {
      const zipBlob = await buildAlbumZipBlob(album);
      const form = new FormData();
      form.append('file', zipBlob, 'slideshow-' + album.id + '-' + album.updatedAt + '.zip');
      const resp = await cloudFetch('/upload', { method: 'POST', body: form });
      if (!resp.ok) throw new Error('upload-failed');
      return true;
    } catch (e) {
      console.error('Cloud backup failed', e);
      return false;
    }
  }

  async function restoreAlbumFromCloud(hash) {
    const resp = await cloudFetch('/download/' + hash);
    if (!resp.ok) throw new Error('download-failed');
    const buf = await resp.arrayBuffer();
    const entries = parseZip(buf);
    let meta = null;
    const imageEntries = [];
    entries.forEach(e => {
      if (e.name === '__meta.json') {
        meta = JSON.parse(new TextDecoder('utf-8').decode(e.data));
      } else {
        imageEntries.push(e);
      }
    });
    if (!meta) throw new Error('no-meta');
    imageEntries.sort((a, b) => a.name.localeCompare(b.name));
    const images = imageEntries.map(e => {
      const idx = e.name.indexOf('__');
      const origName = idx >= 0 ? e.name.slice(idx + 2) : e.name;
      return { id: uid(), name: origName, blob: new Blob([e.data], { type: guessMimeFromName(origName) }) };
    });
    const album = {
      id: meta.id,
      name: meta.name,
      duration: meta.duration,
      loop: meta.loop,
      shuffle: meta.shuffle,
      images,
      updatedAt: meta.updatedAt
    };
    await dbPut(album);
    return album;
  }

  async function syncWithCloud() {
    if (cloudSyncing) return;
    cloudSyncing = true;
    setCloudStatus('syncing…');
    try {
      const resp = await cloudFetch('/list?perPage=200&orderBy=name&orderDir=asc');
      if (!resp.ok) throw new Error('list-failed');
      const data = await resp.json();
      const cloudEntries = (data.data || []).filter(f => /^slideshow-.+-\d+\.zip$/.test(f.name));
      const latestByAlbum = {};
      cloudEntries.forEach(f => {
        const m = f.name.match(/^slideshow-(.+)-(\d+)\.zip$/);
        if (!m) return;
        const albumId = m[1];
        const ts = parseInt(m[2], 10);
        if (!latestByAlbum[albumId] || ts > latestByAlbum[albumId].ts) {
          latestByAlbum[albumId] = { ts: ts, hash: f.hash };
        }
      });

      const localAlbums = await dbGetAll();
      const localById = Object.fromEntries(localAlbums.map(a => [a.id, a]));

      for (const albumId of Object.keys(latestByAlbum)) {
        const info = latestByAlbum[albumId];
        const local = localById[albumId];
        if (!local || (local.updatedAt || 0) < info.ts) {
          await restoreAlbumFromCloud(info.hash);
        }
      }

      for (const local of localAlbums) {
        const cloudInfo = latestByAlbum[local.id];
        if (!cloudInfo || (local.updatedAt || 0) > cloudInfo.ts) {
          await backupAlbumToCloud(local);
        }
      }

      await loadAlbums();
      setCloudStatus('synced ✓ (private)');
    } catch (e) {
      if (e.message === 'no-password') setCloudStatus('not connected — click to set up');
      else if (e.message === 'bad-password') setCloudStatus('wrong password — click to retry');
      else { console.error(e); setCloudStatus('sync failed — click to retry'); }
    } finally {
      cloudSyncing = false;
    }
  }

  let backupDebounceTimer = null;
  function queueCloudBackup(album) {
    if (backupDebounceTimer) clearTimeout(backupDebounceTimer);
    backupDebounceTimer = setTimeout(async () => {
      setCloudStatus('saving…');
      const ok = await backupAlbumToCloud(album);
      setCloudStatus(ok ? 'synced ✓ (private)' : 'save failed — will retry next change');
    }, 1200);
  }

  let albums = [];
  let currentAlbum = null;
  let gridThumbUrls = [];

  let order = [];
  let currentIndex = 0;
  let timer = null;
  let progressStart = 0;
  let progressRaf = null;
  let paused = false;
  let remainingMs = 0;
  let slideUrls = [];
  let thumbGridUrls = [];

  const viewAlbums = document.getElementById('view-albums');
  const viewAlbum = document.getElementById('view-album');
  const albumGrid = document.getElementById('albumGrid');
  const albumsSub = document.getElementById('albumsSub');
  const emptyState = document.getElementById('emptyState');
  const newAlbumBtn = document.getElementById('newAlbumBtn');
  const backBtn = document.getElementById('backBtn');
  const albumTitle = document.getElementById('albumTitle');
  const dropZone = document.getElementById('dropZone');
  const fileInput = document.getElementById('fileInput');
  const thumbGrid = document.getElementById('thumbGrid');
  const durationInput = document.getElementById('duration');
  const loopCheckbox = document.getElementById('loop');
  const shuffleCheckbox = document.getElementById('shuffle');
  const startBtn = document.getElementById('startBtn');
  const exportBtn = document.getElementById('exportBtn');
  const show = document.getElementById('show');
  const slideLayer = document.getElementById('slideLayer');
  const hudCount = document.getElementById('hudCount');
  const progressBar = document.getElementById('progressBar');
  const pauseBtn = document.getElementById('pauseBtn');
  const toast = document.getElementById('toast');

  function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 2200);
  }

  // ---------------- Modal (replaces native prompt/confirm, which are blocked in this sandbox) ----------------
  const modalOverlay = document.getElementById('modalOverlay');
  const modalTitle = document.getElementById('modalTitle');
  const modalMessage = document.getElementById('modalMessage');
  const modalInput = document.getElementById('modalInput');
  const modalCancel = document.getElementById('modalCancel');
  const modalConfirm = document.getElementById('modalConfirm');
  let modalResolve = null;

  function openModal({ title, message, withInput, inputValue, confirmLabel, danger }) {
    modalTitle.textContent = title || '';
    if (message) {
      modalMessage.textContent = message;
      modalMessage.style.display = 'block';
    } else {
      modalMessage.style.display = 'none';
    }
    if (withInput) {
      modalInput.style.display = 'block';
      modalInput.value = inputValue || '';
    } else {
      modalInput.style.display = 'none';
    }
    modalConfirm.textContent = confirmLabel || 'OK';
    modalConfirm.className = 'btn ' + (danger ? 'danger' : 'primary');
    modalOverlay.classList.add('show');
    if (withInput) setTimeout(() => { modalInput.focus(); modalInput.select(); }, 0);

    return new Promise((resolve) => {
      modalResolve = resolve;
    });
  }

  function closeModal(result) {
    modalOverlay.classList.remove('show');
    if (modalResolve) {
      const r = modalResolve;
      modalResolve = null;
      r(result);
    }
  }

  modalCancel.addEventListener('click', () => closeModal(null));
  modalConfirm.addEventListener('click', () => {
    closeModal(modalInput.style.display === 'block' ? (modalInput.value || '') : true);
  });
  modalInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { e.preventDefault(); closeModal(modalInput.value || ''); }
    else if (e.key === 'Escape') { e.preventDefault(); closeModal(null); }
  });
  modalOverlay.addEventListener('click', (e) => {
    if (e.target === modalOverlay) closeModal(null);
  });

  function revokeGridThumbUrls() {
    gridThumbUrls.forEach(u => URL.revokeObjectURL(u));
    gridThumbUrls = [];
  }

  async function loadAlbums() {
    try {
      albums = await dbGetAll();
      albums.sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
    } catch (e) {
      albums = [];
      showToast('Could not load saved albums in this browser.');
    }
    renderAlbumGrid();
  }

  function renderAlbumGrid() {
    albumGrid.innerHTML = '';
    revokeGridThumbUrls();
    if (!albums.length) {
      emptyState.style.display = 'block';
      albumsSub.textContent = 'No albums yet';
      return;
    }
    emptyState.style.display = 'none';
    albumsSub.textContent = albums.length + ' album' + (albums.length === 1 ? '' : 's');

    albums.forEach(album => {
      const card = document.createElement('div');
      card.className = 'album-card';

      let coverHtml = '<div class="empty-cover">No images</div>';
      if (album.images && album.images.length) {
        const url = URL.createObjectURL(album.images[0].blob);
        gridThumbUrls.push(url);
        coverHtml = '<img src="' + url + '" alt="">';
      }

      card.innerHTML =
        '<div class="album-cover">' + coverHtml + '</div>' +
        '<div class="album-meta">' +
          '<p class="album-name"></p>' +
          '<p class="album-count">' + (album.images ? album.images.length : 0) + ' image' + ((album.images && album.images.length === 1) ? '' : 's') + '</p>' +
        '</div>' +
        '<button class="album-del" title="Delete album">×</button>';
      card.querySelector('.album-name').textContent = album.name;

      card.addEventListener('click', (e) => {
        if (e.target.closest('.album-del')) return;
        openAlbum(album.id);
      });
      card.querySelector('.album-del').addEventListener('click', async (e) => {
        e.stopPropagation();
        const ok = await openModal({
          title: 'Delete album',
          message: 'Delete "' + album.name + '" and all its images? This can\'t be undone.',
          confirmLabel: 'Delete',
          danger: true
        });
        if (!ok) return;
        await dbDelete(album.id);
        await loadAlbums();
        showToast('Album deleted');
      });

      albumGrid.appendChild(card);
    });
  }

  newAlbumBtn.addEventListener('click', async () => {
    const name = await openModal({
      title: 'New album',
      withInput: true,
      inputValue: 'New album',
      confirmLabel: 'Create'
    });
    if (name === null) return;
    const album = {
      id: uid(),
      name: name.trim() || 'Untitled album',
      duration: 4,
      loop: true,
      shuffle: false,
      images: [],
      updatedAt: Date.now()
    };
    await dbPut(album);
    await loadAlbums();
    openAlbum(album.id);
  });

  async function openAlbum(id) {
    const fresh = await dbGetAll();
    currentAlbum = fresh.find(a => a.id === id);
    if (!currentAlbum) { showToast('Album not found'); return; }

    viewAlbums.classList.remove('active');
    viewAlbum.classList.add('active');

    albumTitle.textContent = currentAlbum.name;
    durationInput.value = currentAlbum.duration || 4;
    loopCheckbox.checked = currentAlbum.loop !== false;
    shuffleCheckbox.checked = !!currentAlbum.shuffle;

    renderThumbGrid();
  }

  function revokeThumbGridUrls() {
    thumbGridUrls.forEach(u => URL.revokeObjectURL(u));
    thumbGridUrls = [];
  }

  function backToAlbums() {
    revokeThumbGridUrls();
    viewAlbum.classList.remove('active');
    viewAlbums.classList.add('active');
    currentAlbum = null;
    loadAlbums();
  }
  backBtn.addEventListener('click', backToAlbums);

  albumTitle.addEventListener('click', async () => {
    const name = await openModal({
      title: 'Rename album',
      withInput: true,
      inputValue: currentAlbum.name,
      confirmLabel: 'Save'
    });
    if (name === null || !name.trim()) return;
    currentAlbum.name = name.trim();
    currentAlbum.updatedAt = Date.now();
    await dbPut(currentAlbum);
    albumTitle.textContent = currentAlbum.name;
    queueCloudBackup(currentAlbum);
  });

  function renderThumbGrid() {
    thumbGrid.innerHTML = '';
    revokeThumbGridUrls();
    (currentAlbum.images || []).forEach((img) => {
      const url = URL.createObjectURL(img.blob);
      thumbGridUrls.push(url);
      const div = document.createElement('div');
      div.className = 'thumb';
      div.innerHTML = '<img src="' + url + '" alt="" data-preview-id="' + img.id + '">' +
        '<button data-id="' + img.id + '" title="Remove">×</button>';
      thumbGrid.appendChild(div);
    });
    const count = (currentAlbum.images || []).length;
    startBtn.disabled = count === 0;
    exportBtn.disabled = count === 0;
    startBtn.textContent = count ? 'Start slideshow' : 'Add images to start';
  }

  thumbGrid.addEventListener('click', async (e) => {
    const btn = e.target.closest('button[data-id]');
    if (btn) {
      const imgId = btn.dataset.id;
      currentAlbum.images = currentAlbum.images.filter(i => i.id !== imgId);
      currentAlbum.updatedAt = Date.now();
      await dbPut(currentAlbum);
      renderThumbGrid();
      queueCloudBackup(currentAlbum);
      return;
    }
    const previewImg = e.target.closest('img[data-preview-id]');
    if (previewImg) {
      openLightbox(previewImg.src);
    }
  });

  const lightbox = document.getElementById('lightbox');
  const lightboxImg = document.getElementById('lightboxImg');
  const lightboxClose = document.getElementById('lightboxClose');

  function openLightbox(src) {
    lightboxImg.src = src;
    lightbox.classList.add('show');
  }

  function closeLightbox() {
    lightbox.classList.remove('show');
    lightboxImg.src = '';
  }

  lightbox.addEventListener('click', closeLightbox);
  lightboxClose.addEventListener('click', (e) => { e.stopPropagation(); closeLightbox(); });
  document.addEventListener('keydown', (e) => {
    if (e.code === 'Escape' && lightbox.classList.contains('show')) closeLightbox();
  });

  async function addFilesToAlbum(fileList) {
    const files = Array.from(fileList).filter(f => f.type.startsWith('image/'));
    if (!files.length) return;
    files.forEach(file => {
      currentAlbum.images.push({ id: uid(), name: file.name, blob: file });
    });
    currentAlbum.updatedAt = Date.now();
    try {
      await dbPut(currentAlbum);
    } catch (e) {
      showToast('Could not save — your browser storage may be full.');
      return;
    }
    renderThumbGrid();
    showToast(files.length + ' image' + (files.length === 1 ? '' : 's') + ' added');
    queueCloudBackup(currentAlbum);
  }

  dropZone.addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', (e) => { addFilesToAlbum(e.target.files); fileInput.value = ''; });
  ['dragenter', 'dragover'].forEach(evt => {
    dropZone.addEventListener(evt, (e) => { e.preventDefault(); dropZone.classList.add('dragover'); });
  });
  ['dragleave', 'drop'].forEach(evt => {
    dropZone.addEventListener(evt, (e) => { e.preventDefault(); dropZone.classList.remove('dragover'); });
  });
  dropZone.addEventListener('drop', (e) => {
    if (e.dataTransfer.files && e.dataTransfer.files.length) addFilesToAlbum(e.dataTransfer.files);
  });

  async function saveSettings() {
    if (!currentAlbum) return;
    currentAlbum.duration = parseFloat(durationInput.value) || 4;
    currentAlbum.loop = loopCheckbox.checked;
    currentAlbum.shuffle = shuffleCheckbox.checked;
    currentAlbum.updatedAt = Date.now();
    await dbPut(currentAlbum);
    queueCloudBackup(currentAlbum);
  }
  durationInput.addEventListener('change', saveSettings);
  loopCheckbox.addEventListener('change', saveSettings);
  shuffleCheckbox.addEventListener('change', saveSettings);

  function shuffleArray(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function buildOrder() {
    order = currentAlbum.images.map((_, i) => i);
    if (currentAlbum.shuffle) order = shuffleArray(order);
  }

  function startShow() {
    if (!currentAlbum || !currentAlbum.images.length) return;
    buildOrder();
    currentIndex = 0;
    paused = false;
    pauseBtn.textContent = 'Pause';
    show.style.display = 'block';
    requestFullscreen();
    renderSlide();
  }

  function requestFullscreen() {
    const el = document.documentElement;
    const req = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
    if (req) req.call(el).catch(() => {});
  }

  function exitShow() {
    clearTimer();
    show.style.display = 'none';
    slideLayer.innerHTML = '';
    slideUrls.forEach(u => URL.revokeObjectURL(u));
    slideUrls = [];
    if (document.fullscreenElement) {
      (document.exitFullscreen || document.webkitExitFullscreen || function(){}).call(document);
    }
  }

  function getDurationMs() {
    const v = currentAlbum.duration;
    return (!v || v <= 0 ? 4 : v) * 1000;
  }

  function renderSlide() {
    const imgIndex = order[currentIndex];
    const imgRecord = currentAlbum.images[imgIndex];

    slideUrls.forEach(u => URL.revokeObjectURL(u));
    slideUrls = [];
    const url = URL.createObjectURL(imgRecord.blob);
    slideUrls.push(url);

    const el = document.createElement('img');
    el.className = 'slide-img';
    el.src = url;
    slideLayer.innerHTML = '';
    slideLayer.appendChild(el);
    requestAnimationFrame(() => el.classList.add('visible'));

    hudCount.textContent = (currentIndex + 1) + ' / ' + order.length;
    startTimer();
  }

  function clearTimer() {
    if (timer) { clearTimeout(timer); timer = null; }
    if (progressRaf) { cancelAnimationFrame(progressRaf); progressRaf = null; }
  }

  function startTimer() {
    clearTimer();
    const total = getDurationMs();
    remainingMs = total;
    progressStart = performance.now();
    progressBar.style.width = '0%';

    function tick(now) {
      const elapsed = now - progressStart;
      const pct = Math.min(100, (elapsed / total) * 100);
      progressBar.style.width = pct + '%';
      if (!paused && elapsed < total) progressRaf = requestAnimationFrame(tick);
    }
    progressRaf = requestAnimationFrame(tick);
    timer = setTimeout(() => advance(1), total);
  }

  function pauseTimer() {
    if (paused) return;
    paused = true;
    clearTimer();
    const elapsed = performance.now() - progressStart;
    remainingMs = Math.max(0, getDurationMs() - elapsed);
    pauseBtn.textContent = 'Resume';
  }

  function resumeTimer() {
    if (!paused) return;
    paused = false;
    pauseBtn.textContent = 'Pause';
    const total = getDurationMs();
    progressStart = performance.now() - (total - remainingMs);
    function tick(now) {
      const elapsed = now - progressStart;
      const pct = Math.min(100, (elapsed / total) * 100);
      progressBar.style.width = pct + '%';
      if (!paused && elapsed < total) progressRaf = requestAnimationFrame(tick);
    }
    progressRaf = requestAnimationFrame(tick);
    timer = setTimeout(() => advance(1), remainingMs);
  }

  function advance(dir) {
    clearTimer();
    currentIndex += dir;
    if (currentIndex >= order.length) {
      if (currentAlbum.loop !== false) {
        if (currentAlbum.shuffle) {
          const lastImgIndex = order[order.length - 1];
          let next;
          do {
            next = shuffleArray(order);
          } while (order.length > 1 && next[0] === lastImgIndex);
          order = next;
        }
        currentIndex = 0;
      } else {
        currentIndex = order.length - 1;
        renderSlide();
        clearTimer();
        progressBar.style.width = '100%';
        return;
      }
    }
    if (currentIndex < 0) {
      currentIndex = (currentAlbum.loop !== false) ? order.length - 1 : 0;
    }
    paused = false;
    pauseBtn.textContent = 'Pause';
    renderSlide();
  }

  // ---------- Export album as .zip (no compression, no external libraries) ----------
  const CRC_TABLE = (() => {
    const t = new Uint32Array(256);
    for (let n = 0; n < 256; n++) {
      let c = n;
      for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
      t[n] = c >>> 0;
    }
    return t;
  })();

  function crc32(buf) {
    let c = 0xFFFFFFFF;
    for (let i = 0; i < buf.length; i++) c = CRC_TABLE[(c ^ buf[i]) & 0xFF] ^ (c >>> 8);
    return (c ^ 0xFFFFFFFF) >>> 0;
  }

  async function buildZip(entries) {
    const enc = new TextEncoder();
    const parts = [];
    const central = [];
    let offset = 0;
    const d = new Date();
    const dosTime = (d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1);
    const dosDate = ((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate();

    for (const e of entries) {
      const crc = crc32(new Uint8Array(await e.blob.arrayBuffer()));
      const size = e.blob.size;
      const name = enc.encode(e.name);

      const lh = new DataView(new ArrayBuffer(30));
      lh.setUint32(0, 0x04034b50, true);
      lh.setUint16(4, 20, true);
      lh.setUint16(6, 0x0800, true);          // UTF-8 file names
      lh.setUint16(8, 0, true);               // stored (no compression)
      lh.setUint16(10, dosTime, true);
      lh.setUint16(12, dosDate, true);
      lh.setUint32(14, crc, true);
      lh.setUint32(18, size, true);
      lh.setUint32(22, size, true);
      lh.setUint16(26, name.length, true);
      parts.push(lh.buffer, name, e.blob);

      const ch = new DataView(new ArrayBuffer(46));
      ch.setUint32(0, 0x02014b50, true);
      ch.setUint16(4, 20, true);
      ch.setUint16(6, 20, true);
      ch.setUint16(8, 0x0800, true);
      ch.setUint16(12, dosTime, true);
      ch.setUint16(14, dosDate, true);
      ch.setUint32(16, crc, true);
      ch.setUint32(20, size, true);
      ch.setUint32(24, size, true);
      ch.setUint16(28, name.length, true);
      ch.setUint32(42, offset, true);
      central.push(ch.buffer, name);

      offset += 30 + name.length + size;
    }

    const cdSize = central.reduce((sum, p) => sum + p.byteLength, 0);
    const end = new DataView(new ArrayBuffer(22));
    end.setUint32(0, 0x06054b50, true);
    end.setUint16(8, entries.length, true);
    end.setUint16(10, entries.length, true);
    end.setUint32(12, cdSize, true);
    end.setUint32(16, offset, true);

    return new Blob([...parts, ...central, end.buffer], { type: 'application/zip' });
  }

  const MIME_EXT = {
    'image/jpeg': 'jpg', 'image/png': 'png', 'image/gif': 'gif', 'image/webp': 'webp',
    'image/avif': 'avif', 'image/bmp': 'bmp', 'image/svg+xml': 'svg',
    'image/heic': 'heic', 'image/heif': 'heif', 'image/tiff': 'tif'
  };

  function safeFileName(name, blob, index) {
    let n = String(name || '').replace(/[\\/:*?"<>|\u0000-\u001f]/g, '_').trim();
    if (!n) n = 'image-' + (index + 1);
    if (!/\.[A-Za-z0-9]{2,5}$/.test(n)) {
      const ext = MIME_EXT[blob.type];
      if (ext) n += '.' + ext;
    }
    return n;
  }

  function uniqueNames(images) {
    const used = new Set();
    return images.map((img, i) => {
      const base = safeFileName(img.name, img.blob, i);
      let candidate = base;
      let n = 2;
      while (used.has(candidate.toLowerCase())) {
        const dot = base.lastIndexOf('.');
        candidate = dot > 0
          ? base.slice(0, dot) + ' (' + n + ')' + base.slice(dot)
          : base + ' (' + n + ')';
        n++;
      }
      used.add(candidate.toLowerCase());
      return candidate;
    });
  }

  async function exportAlbumZip() {
    const images = (currentAlbum && currentAlbum.images) || [];
    if (!images.length) return;

    const total = images.reduce((sum, img) => sum + img.blob.size, 0);
    if (total > 4 * 1024 * 1024 * 1024 - 1024 * 1024) {
      showToast('Album is too large to export as one zip (over 4 GB).');
      return;
    }

    const label = exportBtn.textContent;
    exportBtn.disabled = true;
    exportBtn.textContent = 'Preparing zip…';
    try {
      const names = uniqueNames(images);
      const zip = await buildZip(images.map((img, i) => ({ name: names[i], blob: img.blob })));
      const folder = (currentAlbum.name || 'album').replace(/[\\/:*?"<>|\u0000-\u001f]/g, '_').trim() || 'album';
      const url = URL.createObjectURL(zip);
      const a = document.createElement('a');
      a.href = url;
      a.download = folder + '.zip';
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 60000);
      showToast(images.length + ' image' + (images.length === 1 ? '' : 's') + ' exported');
    } catch (err) {
      console.error(err);
      showToast('Could not create the zip file.');
    } finally {
      exportBtn.textContent = label;
      exportBtn.disabled = ((currentAlbum && currentAlbum.images) || []).length === 0;
    }
  }

  exportBtn.addEventListener('click', exportAlbumZip);

  startBtn.addEventListener('click', startShow);
  document.getElementById('exitBtn').addEventListener('click', exitShow);
  document.getElementById('nextBtn').addEventListener('click', () => advance(1));
  document.getElementById('prevBtn').addEventListener('click', () => advance(-1));
  pauseBtn.addEventListener('click', () => paused ? resumeTimer() : pauseTimer());

  document.addEventListener('keydown', (e) => {
    if (show.style.display !== 'block') return;
    if (e.code === 'Space') { e.preventDefault(); paused ? resumeTimer() : pauseTimer(); }
    else if (e.code === 'ArrowRight') advance(1);
    else if (e.code === 'ArrowLeft') advance(-1);
    else if (e.code === 'Escape') exitShow();
  });

  loadAlbums().then(() => { syncWithCloud(); });
})();
</script>
</body>
</html>
